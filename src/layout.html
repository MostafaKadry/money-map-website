<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#10b981">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:site_name" content="{{site.name}}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{assets}}assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="{{assets}}assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="{{assets}}assets/css/site.css">
  {{head}}
</head>
<body class="{{bodyClass}}">
  <a class="skip" href="#main">{{site.skip}}</a>
{{header}}
  <main id="main" tabindex="-1">
{{content}}
  </main>
{{footer}}
</body>
</html>
